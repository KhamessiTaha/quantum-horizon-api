app = "quantum-horizon-api"
primary_region = "iad"

# iad is Virginia, next door to AWS us-east-1 where the SPHEREx mirror lives. In the research phase, reading pixels
# from Tunisia took 1.77 s a frame; from here it should be well under that.

[build]
  dockerfile = "Dockerfile"

[env]
  QH_CACHE_DIR = "/data/cache"
  QH_READ_WORKERS = "8"
  # Add the deployed frontend's origin here, comma separated, before the first demo.
  QH_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[mounts]]
  source = "qh_cache"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
